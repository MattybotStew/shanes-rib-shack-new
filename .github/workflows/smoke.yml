name: Smoke Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Lint
        run: npm run lint

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /shanes-rib-shack-new
          NEXT_PUBLIC_SITE_URL: https://mattybotstew.github.io/shanes-rib-shack-new
          NEXT_PUBLIC_EZCATER_URL: ${{ secrets.NEXT_PUBLIC_EZCATER_URL }}
          NEXT_PUBLIC_CATERING_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CATERING_FORM_ENDPOINT }}
        run: npm run build

      - name: Run Playwright smoke suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
