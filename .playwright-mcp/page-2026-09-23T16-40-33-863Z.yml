      - paragraph [ref=f7e34]: THANK ‘QUE, Shaniacs! At Shane’s Rib Shack, Southern BBQ has always been about more than what’s on the plate — it’s about the people. Whether you’ve stopped in for a quick lunch, picked up dinner, or made us part of your weekend tradition, you’ve become part of our family.
