    - region "Edgewood location details" [ref=f2e58]:
      - generic [ref=f2e59]:
        - heading "Shane's Rib Shack in Edgewood, Atlanta, GA" [level=2] [ref=f2e60]
        - paragraph [ref=f2e61]:
          - text: "1221 Caroline St, Atlanta, GA 30307Call for Pickup:"
          - link "(404) 525-7427" [ref=f2e62] [cursor=pointer]:
            - /url: tel:+14045257427
        - paragraph [ref=f2e63]:
          - text: Some meals are about speed. Others are about sitting down, catching your breath, and actually enjoying what's on the table. Shane's Rib Shack in Edgewood falls into the second category. Located just off Caroline Street near the
          - link "retail district" [ref=f2e64] [cursor=pointer]:
            - /url: https://www.shopedgewoodretaildistrict.com/
          - text: and a short drive from neighborhoods like
          - link "Candler Park" [ref=f2e65] [cursor=pointer]:
            - /url: https://maps.app.goo.gl/wtuDmPkQYUZzVD6m9
          - text: and Kirkwood, this Shack feels right at home in a part of Atlanta that values good food without unnecessary fuss.
        - generic [ref=f2e66]:
          - heading "BBQ and Ribs in Edgewood Worth Slowing Down For" [level=3] [ref=f2e67]
          - paragraph [ref=f2e68]: This Edgewood location is a strong choice when ribs are what you're craving. Baby back ribs are smoked in-house until tender and served with your choice of sauce, making them a popular option for both dine-in meals and takeout. Chopped BBQ pork plates are another go-to, served with Texas toast and classic sides like mac & cheese, baked beans, or coleslaw.
          - paragraph [ref=f2e69]: Instead of rushing through the menu, many guests here take their time. The Shack Sampler Plate is a common pick when you want ribs, chopped pork or chicken, tenders, and sides all in one order. For something handheld, the Big Dad Sandwich delivers slow-smoked chopped BBQ pork on Texas toast and works just as well for lunch as it does for dinner.
        - generic [ref=f2e70]:
          - heading "A Neighborhood Spot for Casual Meals and Meetups" [level=3] [ref=f2e71]
          - paragraph [ref=f2e72]: Edgewood is known for being walkable and social, and this Shack fits right into that rhythm. It's a comfortable stop for small groups meeting up after work or neighbors grabbing dinner without heading across town. Wings, especially smoked or boneless, are often added to orders for sharing, while Shack Fries or Shack Potatoes topped with chopped BBQ pork give the table something extra.
          - paragraph [ref=f2e73]: Sides like Brunswick stew, fried okra, and green beans help round out meals, and peach cobbler often finds its way onto the order when people decide to stay a little longer.
        - generic [ref=f2e74]:
          - heading "Why This Edgewood Shack Feels Like a Local Fixture" [level=3] [ref=f2e75]
          - paragraph [ref=f2e76]:
            - text: What sets this location apart is how easily it blends into the neighborhood. The food is consistent, the portions are generous, and nothing feels rushed. To check hours, directions, or recent reviews before stopping by, you can
            - link [ref=f2e77] [cursor=pointer]:
              - /url: https://share.google/u4OXEI1eqfdr3ZXRE
              - strong [ref=f2e78]: view our Google Business Profile
            - text: .
        - paragraph [ref=f2e79]: If you want to plan ahead, you can explore the menu, or learn more about how Shane's Rib Shack got its start by visiting our story.
